<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mailhub</title>
<style>
  /* Plain functional shell — the Telegraph Exchange skin lands in the design phase. */
  body { font: 15px/1.45 system-ui, sans-serif; margin: 0; background: #f5f4f0; color: #1c1b18; }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px;
           background: #1c1b18; color: #f5f4f0; flex-wrap: wrap; }
  header h1 { font-size: 16px; letter-spacing: .2em; margin: 0; }
  #search { flex: 1; min-width: 200px; padding: 6px 10px; border: 0; }
  #chips button, #lanes button { margin-right: 6px; padding: 4px 10px; cursor: pointer; }
  #chips button.on, #lanes button.on { background: #1c1b18; color: #f5f4f0; }
  #lanes { border-left: 1px solid #6d6a60; padding-left: 12px; }
  #rulespanel { display: none; padding: 10px 16px; background: #ecebe4;
                border-bottom: 1px solid #ccc; }
  #rulespanel.open { display: block; }
  #rulespanel .rule { padding: 3px 0; font-size: 13px; }
  #rulespanel .rule button { margin-left: 8px; cursor: pointer; }
  #rulespanel form { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  #rulespanel .err { color: #8a2f20; font-size: 13px; margin-left: 8px; }
  main { display: grid; grid-template-columns: minmax(320px, 1fr) 2fr; height: calc(100vh - 52px); }
  #list { overflow-y: auto; border-right: 1px solid #ccc; }
  .row { padding: 10px 14px; border-bottom: 1px solid #e2e0d8; cursor: pointer; }
  .row:hover { background: #ecebe4; }
  .row.unread .subj { font-weight: 700; }
  .row .meta { display: flex; justify-content: space-between; font-size: 12px; color: #6d6a60; }
  .row .snip { font-size: 13px; color: #6d6a60; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 11px; background: #d9d6ca; padding: 1px 6px; border-radius: 3px; }
  #reader { overflow-y: auto; padding: 20px 24px; }
  #reader iframe { width: 100%; min-height: 60vh; border: 1px solid #ccc; background: #fff; }
  #reader pre { white-space: pre-wrap; background: #fff; padding: 16px; border: 1px solid #ccc; }
  #reader .hdr a { font-size: 13px; }
  .empty { padding: 40px; color: #6d6a60; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>MAILHUB</h1>
  <span id="chips"></span>
  <span id="lanes"></span>
  <input id="search" type="search" placeholder="Search all accounts…">
  <button id="rulesbtn" title="Lane rules">Rules</button>
  <button id="syncbtn" title="Sync now">↻</button>
</header>
<div id="rulespanel">
  <div id="rulelist"></div>
  <form id="ruleform">
    <select id="rfield">
      <option value="from_domain">From domain</option>
      <option value="from_email">From address</option>
      <option value="subject">Subject</option>
    </select>
    <input id="rpattern" placeholder="contains…" required>
    <select id="rlane">
      <option value="people">People</option>
      <option value="newsletters">Newsletters</option>
      <option value="receipts">Receipts</option>
      <option value="notifications">Notifications</option>
    </select>
    <button type="submit">Add rule</button>
    <span class="err" id="ruleerr"></span>
  </form>
</div>
<main>
  <div id="list"><div class="empty">Loading…</div></div>
  <div id="reader"><div class="empty">Select a message</div></div>
</main>
<script>
let account = null, lane = null, q = "", debounce = null;
const LANES = ["people", "newsletters", "receipts", "notifications"];
const LANE_LABEL = { people: "People", newsletters: "Newsletters",
                     receipts: "Receipts", notifications: "Notifications" };

const esc = s => (s || "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function loadAccounts() {
  const { accounts } = await (await fetch("api/accounts")).json();
  const chips = document.getElementById("chips");
  chips.innerHTML = "";
  const all = document.createElement("button");
  all.textContent = "All";
  all.className = account === null ? "on" : "";
  all.onclick = () => { account = null; refresh(); };
  chips.appendChild(all);
  for (const a of accounts) {
    const b = document.createElement("button");
    b.textContent = `${a.display_name || a.email} (${a.unread_count || 0})`;
    b.className = account === a.id ? "on" : "";
    b.onclick = () => { account = a.id; refresh(); };
    chips.appendChild(b);
  }
}

async function loadLanes() {
  const { lanes } = await (await fetch("api/lanes")).json();
  const el = document.getElementById("lanes");
  el.innerHTML = "";
  const all = document.createElement("button");
  all.textContent = "All lanes";
  all.className = lane === null ? "on" : "";
  all.onclick = () => { lane = null; refresh(); };
  el.appendChild(all);
  for (const ln of LANES) {
    const c = lanes[ln] || { total: 0, unread: 0 };
    const b = document.createElement("button");
    b.textContent = `${LANE_LABEL[ln]} (${c.unread || 0})`;
    b.className = lane === ln ? "on" : "";
    b.onclick = () => { lane = ln; refresh(); };
    el.appendChild(b);
  }
}

async function loadRules() {
  const { rules } = await (await fetch("api/rules")).json();
  const el = document.getElementById("rulelist");
  el.innerHTML = rules.length ? "" : "<em>No rules yet — heuristics only.</em>";
  for (const r of rules) {
    const d = document.createElement("div");
    d.className = "rule";
    d.textContent = `${r.field} contains "${r.pattern}" → ${LANE_LABEL[r.lane] || r.lane}`;
    const del = document.createElement("button");
    del.textContent = "×";
    del.onclick = async () => {
      await fetch("api/rules/" + r.id, { method: "DELETE" });
      loadRules(); refresh();
    };
    d.appendChild(del);
    el.appendChild(d);
  }
}

async function loadList() {
  const p = new URLSearchParams();
  if (q) p.set("q", q);
  if (account !== null) p.set("account", account);
  if (lane !== null) p.set("lane", lane);
  const { messages } = await (await fetch("api/messages?" + p)).json();
  const list = document.getElementById("list");
  if (!messages.length) {
    list.innerHTML = `<div class="empty">${q ? "No matches." : "No mail synced yet."}</div>`;
    return;
  }
  list.innerHTML = messages.map(m => `
    <div class="row ${m.is_read ? "" : "unread"}" data-id="${m.id}">
      <div class="meta"><span><span class="badge">${esc(m.account_email)}</span>
        ${esc(m.from_name || m.from_email)}</span>
        <span>${esc((m.date_utc || "").slice(0, 16).replace("T", " "))}</span></div>
      <div class="subj">${esc(m.subject) || "(no subject)"}</div>
      <div class="snip">${esc(m.snippet)}</div>
    </div>`).join("");
  for (const el of list.querySelectorAll(".row"))
    el.onclick = () => openMessage(+el.dataset.id, el);
}

function gmailLink(m) {
  if (!m.message_id) return "";
  const id = encodeURIComponent(m.message_id.replace(/^<|>$/g, ""));
  return `https://mail.google.com/mail/u/${encodeURIComponent(m.account_email)}/#search/rfc822msgid%3A${id}`;
}

async function openMessage(id, rowEl) {
  const m = await (await fetch("api/messages/" + id)).json();
  const reader = document.getElementById("reader");
  const link = gmailLink(m);
  reader.innerHTML = `
    <div class="hdr">
      <h2>${esc(m.subject) || "(no subject)"}</h2>
      <p>${esc(m.from_name)} &lt;${esc(m.from_email)}&gt;
         — ${esc(m.account_email)} — ${esc(m.date_utc)}</p>
      ${link ? `<a href="${link}" target="_blank" rel="noopener">Open in Gmail ↗</a>` : ""}
    </div>
    ${m.body_html
      ? `<iframe sandbox srcdoc="${esc(m.body_html)}"></iframe>`
      : `<pre>${esc(m.body_text)}</pre>`}`;
  if (!m.is_read) {
    fetch(`api/messages/${id}/read`, { method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ read: true }) });
    if (rowEl) rowEl.classList.remove("unread");
  }
}

function refresh() { loadAccounts(); loadLanes(); loadList(); }

document.getElementById("rulesbtn").onclick = () => {
  const p = document.getElementById("rulespanel");
  p.classList.toggle("open");
  if (p.classList.contains("open")) loadRules();
};
document.getElementById("ruleform").onsubmit = async e => {
  e.preventDefault();
  const err = document.getElementById("ruleerr");
  err.textContent = "";
  const res = await fetch("api/rules", { method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      field: document.getElementById("rfield").value,
      pattern: document.getElementById("rpattern").value,
      lane: document.getElementById("rlane").value }) });
  const body = await res.json();
  if (!res.ok) { err.textContent = body.error || "failed"; return; }
  document.getElementById("rpattern").value = "";
  loadRules(); refresh();
};

document.getElementById("search").addEventListener("input", e => {
  clearTimeout(debounce);
  debounce = setTimeout(() => { q = e.target.value.trim(); loadList(); }, 250);
});
document.getElementById("syncbtn").onclick = async () => {
  await fetch("api/sync", { method: "POST" });
  setTimeout(refresh, 3000);
};

refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
